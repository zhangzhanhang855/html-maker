<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>JR Studio — HTML Maker</title>
  <style>
    :root {
      --primary: #0A84FF;
      --primary-glow: rgba(10, 132, 255, 0.35);
      --destructive: #FF453A;
      --success: #30D158;
      --bg-base: #000000;
      --panel-surface: rgba(28, 28, 32, 0.82);
      --card-surface: rgba(44, 44, 48, 0.65);
      --card-highlight: rgba(255, 255, 255, 0.08);
      --text-main: #FFFFFF;
      --text-secondary: rgba(235, 235, 245, 0.6);
      --text-tertiary: rgba(235, 235, 245, 0.3);
      --border-subtle: rgba(255, 255, 255, 0.12);
      --border-vibrant: rgba(255, 255, 255, 0.22);
      --radius-sm: 12px;
      --radius-md: 18px;
      --radius-lg: 24px;
      --radius-full: 9999px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      outline: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    .app-viewport {
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #000000 70%);
    }

    /* 顶部导航栏 */
    header {
      padding-top: calc(var(--safe-top) + 10px);
      padding-left: 20px;
      padding-right: 20px;
      padding-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, #0A84FF, #5E5CE6);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px var(--primary-glow);
    }

    .brand-mark svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
    }

    .brand-name {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .header-pills {
      display: flex;
      gap: 8px;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--border-subtle);
      background: var(--card-surface);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: var(--radius-full);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .btn:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.14);
    }

    .btn-primary {
      background: linear-gradient(135deg, #0A84FF 0%, #0066CC 100%);
      border: none;
      box-shadow: 0 4px 18px var(--primary-glow);
    }

    .btn-danger {
      background: rgba(255, 69, 58, 0.18);
      border-color: rgba(255, 69, 58, 0.3);
      color: #FF453A;
    }

    /* 画布区域 */
    .stage {
      flex: 1;
      position: relative;
      margin: 0 16px 14px 16px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      background: #121214;
    }

    #artboard-canvas {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* 组件外框及拖动指示 */
    .canvas-widget {
      position: absolute;
      touch-action: none;
      cursor: grab;
      border-radius: var(--radius-md);
      transition: box-shadow 0.2s ease;
    }

    .canvas-widget:active {
      cursor: grabbing;
    }

    .canvas-widget.selected {
      box-shadow: 0 0 0 2px var(--primary), 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .widget-drag-pill {
      position: absolute;
      top: -28px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--primary);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 12px;
      border-radius: var(--radius-full);
      box-shadow: 0 4px 12px var(--primary-glow);
      display: none;
      white-space: nowrap;
      pointer-events: none;
    }

    .canvas-widget.selected .widget-drag-pill {
      display: block;
    }

    /* 底部功能 Dock 栏 */
    footer {
      padding-bottom: calc(var(--safe-bottom) + 14px);
      padding-left: 20px;
      padding-right: 20px;
      display: flex;
      justify-content: center;
      z-index: 100;
    }

    .dock {
      background: var(--panel-surface);
      backdrop-filter: blur(35px);
      -webkit-backdrop-filter: blur(35px);
      border: 1px solid var(--border-vibrant);
      border-radius: var(--radius-full);
      padding: 6px 12px;
      display: flex;
      gap: 6px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
    }

    .dock-tab {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .dock-tab svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    .dock-tab.active, .dock-tab:active {
      color: var(--text-main);
      background: var(--card-highlight);
    }

    /* 模态抽屉底板 */
    .sheet-scrim {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sheet-scrim.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet-container {
      position: fixed;
      left: 14px;
      right: 14px;
      bottom: calc(var(--safe-bottom) + 12px);
      background: var(--panel-surface);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid var(--border-vibrant);
      border-radius: 28px;
      padding: 22px;
      z-index: 501;
      transform: translateY(120%);
      transition: transform 0.38s cubic-bezier(0.2, 0.9, 0.25, 1);
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75);
    }

    .sheet-container.visible {
      transform: translateY(0);
    }

    .sheet-handle-bar {
      width: 42px;
      height: 5px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.2);
      margin: 0 auto 16px auto;
    }

    .sheet-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .sheet-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .sheet-close {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: var(--text-secondary);
      border-radius: var(--radius-full);
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
    }

    .field-caption {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
      display: block;
    }

    /* 输入框组件 (替代 prompt) */
    .input-pill-field {
      width: 100%;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 14px;
      user-select: text;
      -webkit-user-select: text;
    }

    .input-pill-field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-glow);
    }

    /* 背景预设色块 */
    .swatches-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }

    .swatch {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      border: 2px solid var(--border-subtle);
      flex-shrink: 0;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .swatch:active {
      transform: scale(0.92);
    }

    .color-input-wrapper {
      height: 48px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      margin-bottom: 16px;
      background: var(--card-surface);
      display: flex;
      align-items: center;
      padding: 0 16px;
      justify-content: space-between;
    }

    .color-input-wrapper input[type="color"] {
      border: none;
      background: none;
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }

    /* 组件卡片网格 */
    .widget-catalog {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .widget-item {
      background: var(--card-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
    }

    .widget-item:active {
      transform: scale(0.96);
      background: var(--card-highlight);
    }

    .widget-thumb {
      height: 56px;
      border-radius: var(--radius-sm);
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .widget-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }

    .widget-desc {
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.3;
    }

    /* 系统级浮动胶囊提示 (完全替代 Alert) */
    .notification-pill {
      position: fixed;
      top: calc(var(--safe-top) + 16px);
      left: 50%;
      transform: translateX(-50%) translateY(-35px);
      background: rgba(30, 30, 34, 0.92);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--border-vibrant);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: var(--radius-full);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      z-index: 2000;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .notification-pill.active {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .notification-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primary);
    }
  </style>
</head>
<body>

  <div class="app-viewport">

    <!-- 顶部操作条 -->
    <header>
      <div class="brand-cluster">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <div class="brand-name">网页排版器</div>
      </div>
      <div class="header-pills">
        <button class="btn btn-danger" id="action-delete" style="display: none;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          删除
        </button>
        <button class="btn btn-primary" id="action-export">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
          导出
        </button>
      </div>
    </header>

    <!-- 主画布 -->
    <div class="stage">
      <div id="artboard-canvas"></div>
    </div>

    <!-- 底部 Dock 栏（新增 GitHub 同步选项） -->
    <footer>
      <div class="dock">
        <button class="dock-tab" id="tab-bg">
          <svg viewBox="0 0 24 24"><path d="M12 22C6.49 22 2 17.51 2 12S6.49 2 12 2s10 4.04 10 9c0 3.31-2.69 6-6 6h-1.77c-.28 0-.5.22-.5.5 0 .12.05.23.13.33.41.47.64 1.06.64 1.67 0 1.38-1.12 2.5-2.5 2.5zm0-18c-4.41 0-8 3.59-8 8s3.59 8 8 8c.28 0 .5-.22.5-.5 0-.16-.08-.28-.14-.35-.41-.46-.63-1.05-.63-1.65 0-1.38 1.12-2.5 2.5-2.5H16c2.21 0 4-1.79 4-4 0-3.86-3.59-7-8-7z"/></svg>
          背景设置
        </button>
        <button class="dock-tab" id="tab-widgets">
          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h6v-6zM19 3h-6v6h6V3zM9 13H3v6h6v-6zm0-10H3v6h6V3z"/></svg>
          组件库
        </button>
        <button class="dock-tab" id="tab-sync">
          <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0020 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 004 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
          同步 GitHub
        </button>
      </div>
    </footer>

  </div>

  <!-- 背景设置面板 -->
  <div class="sheet-scrim" id="scrim-bg"></div>
  <div class="sheet-container" id="drawer-bg">
    <div class="sheet-handle-bar"></div>
    <div class="sheet-top">
      <div class="sheet-title">画布背景调节</div>
      <button class="sheet-close" data-dismiss="drawer-bg">完成</button>
    </div>

    <span class="field-caption">经典纯色与微光渐变</span>
    <div class="swatches-scroll">
      <div class="swatch" style="background: #000000;" data-bg="#000000"></div>
      <div class="swatch" style="background: #18181b;" data-bg="#18181b"></div>
      <div class="swatch" style="background: linear-gradient(135deg, #1e3a8a, #0f172a);" data-bg="linear-gradient(135deg, #1e3a8a, #0f172a)"></div>
      <div class="swatch" style="background: linear-gradient(135deg, #831843, #18181b);" data-bg="linear-gradient(135deg, #831843, #18181b)"></div>
      <div class="swatch" style="background: linear-gradient(135deg, #134e4a, #042f2e);" data-bg="linear-gradient(135deg, #134e4a, #042f2e)"></div>
    </div>

    <span class="field-caption">精确色彩选择</span>
    <div class="color-input-wrapper">
      <span style="font-size: 14px; font-weight: 500;">自由调色板</span>
      <input type="color" id="native-bg-color" value="#121214" />
    </div>

    <span class="field-caption">导入本地相册壁纸</span>
    <input type="file" id="local-img-input" accept="image/*" style="display: none;" />
    <button class="btn" style="width: 100%; border-radius: var(--radius-md); padding: 13px;" onclick="document.getElementById('local-img-input').click()">
      选择本地图片
    </button>
  </div>

  <!-- 组件库面板 -->
  <div class="sheet-scrim" id="scrim-widgets"></div>
  <div class="sheet-container" id="drawer-widgets">
    <div class="sheet-handle-bar"></div>
    <div class="sheet-top">
      <div class="sheet-title">可用组件</div>
      <button class="sheet-close" data-dismiss="drawer-widgets">关闭</button>
    </div>
    <div class="widget-catalog" id="catalog-list"></div>
  </div>

  <!-- 新增：GitHub 专属同步管理面板（免 Alert / Prompt） -->
  <div class="sheet-scrim" id="scrim-sync"></div>
  <div class="sheet-container" id="drawer-sync">
    <div class="sheet-handle-bar"></div>
    <div class="sheet-top">
      <div class="sheet-title">GitHub 仓库同步</div>
      <button class="sheet-close" data-dismiss="drawer-sync">关闭</button>
    </div>

    <span class="field-caption">仓库路径 (用户名/仓库名)</span>
    <input type="text" class="input-pill-field" id="sync-repo-name" value="zhangzhanhang855/html-maker" placeholder="例: zhangzhanhang855/html-maker" />

    <span class="field-caption">分支 (Branch)</span>
    <input type="text" class="input-pill-field" id="sync-branch-name" value="main" placeholder="main" />

    <div style="background: rgba(255,255,255,0.04); border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 18px; border: 1px solid var(--border-subtle);">
      <div style="font-size: 12px; color: var(--text-secondary); line-height: 1.5;" id="sync-status-text">
        准备就绪：点击下方按钮将同时从 jsDelivr CDN 加速节点和 GitHub 拉取 widgets.json
      </div>
    </div>

    <button class="btn btn-primary" id="btn-start-sync" style="width: 100%; border-radius: var(--radius-md); padding: 14px; font-size: 15px;">
      立即同步最新小组件
    </button>
  </div>

  <!-- 提示胶囊 -->
  <div class="notification-pill" id="notification-capsule">
    <div class="notification-dot"></div>
    <span id="notification-msg"></span>
  </div>

  <script>
    (function () {
      const state = {
        background: '#121214',
        isImage: false,
        activeNode: null,
        catalog: []
      };

      const canvas = document.getElementById('artboard-canvas');
      const deleteBtn = document.getElementById('action-delete');
      const notification = document.getElementById('notification-capsule');
      const notificationMsg = document.getElementById('notification-msg');
      const syncStatusText = document.getElementById('sync-status-text');

      function notify(msg) {
        notificationMsg.textContent = msg;
        notification.classList.add('active');
        clearTimeout(notification._timer);
        notification._timer = setTimeout(() => {
          notification.classList.remove('active');
        }, 2200);
      }

      /* 抽屉逻辑 */
      function openDrawer(drawerId, scrimId) {
        document.getElementById(drawerId).classList.add('visible');
        document.getElementById(scrimId).classList.add('visible');
      }

      function closeDrawer(drawerId, scrimId) {
        document.getElementById(drawerId).classList.remove('visible');
        document.getElementById(scrimId).classList.remove('visible');
      }

      document.querySelectorAll('[data-dismiss]').forEach(btn => {
        btn.addEventListener('click', () => {
          const target = btn.getAttribute('data-dismiss');
          closeDrawer(target, target.replace('drawer-', 'scrim-'));
        });
      });

      document.getElementById('scrim-bg').addEventListener('click', () => closeDrawer('drawer-bg', 'scrim-bg'));
      document.getElementById('scrim-widgets').addEventListener('click', () => closeDrawer('drawer-widgets', 'scrim-widgets'));
      document.getElementById('scrim-sync').addEventListener('click', () => closeDrawer('drawer-sync', 'scrim-sync'));

      document.getElementById('tab-bg').addEventListener('click', () => openDrawer('drawer-bg', 'scrim-bg'));
      document.getElementById('tab-widgets').addEventListener('click', () => openDrawer('drawer-widgets', 'scrim-widgets'));
      document.getElementById('tab-sync').addEventListener('click', () => openDrawer('drawer-sync', 'scrim-sync'));

      /* 背景控制 */
      function applyBackground() {
        if (state.isImage) {
          canvas.style.backgroundImage = `url(${state.background})`;
          canvas.style.backgroundColor = 'transparent';
        } else {
          canvas.style.backgroundImage = 'none';
          if (state.background.includes('gradient')) {
            canvas.style.background = state.background;
          } else {
            canvas.style.backgroundColor = state.background;
          }
        }
      }

      document.querySelectorAll('.swatch').forEach(sw => {
        sw.addEventListener('click', () => {
          state.background = sw.getAttribute('data-bg');
          state.isImage = false;
          applyBackground();
          notify('背景样式已更新');
        });
      });

      document.getElementById('native-bg-color').addEventListener('input', (e) => {
        state.background = e.target.value;
        state.isImage = false;
        applyBackground();
      });

      document.getElementById('local-img-input').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          state.background = evt.target.result;
          state.isImage = true;
          applyBackground();
          closeDrawer('drawer-bg', 'scrim-bg');
          notify('本地壁纸导入成功');
        };
        reader.readAsDataURL(file);
      });

      /* 内置默认小组件（包含高保真 MP3/FLAC 播放器） */
      const BUILTIN_WIDGETS = [
        {
          id: 'jr-audio-player-pro',
          name: '高保真音乐播放器',
          desc: '支持 MP3/FLAC，自动解析封面、歌名和作者',
          icon: '🎵',
          html: `<div class="canvas-widget" data-widget-id="jr-audio-player-pro" data-widget-name="Hi-Fi Audio Player" style="position: absolute; left: 20px; top: 80px; width: 320px; z-index: 20;"><div class="widget-drag-pill">⠿ 移动播放器</div><div class="widget-content" style="background: rgba(26, 26, 30, 0.85); backdrop-filter: blur(35px); -webkit-backdrop-filter: blur(35px); border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 28px; padding: 18px; box-shadow: 0 20px 45px rgba(0, 0, 0, 0.55); color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, sans-serif;"><input type="file" class="player-file-input" accept=".mp3,audio/mpeg,.flac,audio/flac" style="display: none;" /><audio class="player-audio-core" preload="metadata" style="display: none;"></audio><div style="display: flex; align-items: center; gap: 14px; margin-bottom: 16px;"><div class="player-art-wrap" style="width: 68px; height: 68px; border-radius: 18px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer;"><img class="player-cover-img" style="width: 100%; height: 100%; object-fit: cover; display: none;" /><span class="player-cover-fallback" style="font-size:26px;">💿</span></div><div style="flex: 1; min-width: 0;"><div class="player-track-title" style="font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">点击封面载入音频</div><div class="player-track-artist" style="font-size: 13px; color: rgba(235, 235, 245, 0.6); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">支持 MP3 / FLAC</div></div></div><div style="margin-bottom: 12px;"><input type="range" class="player-progress-bar" value="0" min="0" max="100" step="0.1" style="width: 100%; height: 5px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); outline: none; cursor: pointer;" /><div style="display: flex; justify-content: space-between; font-size: 11px; color: rgba(235, 235, 245, 0.45); margin-top: 6px;"><span class="player-cur-time">0:00</span><span class="player-total-time">0:00</span></div></div><div style="display: flex; align-items: center; justify-content: space-between;"><button class="player-btn-eject" style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.12); color: #fff; padding: 8px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer;">📂 选择文件</button><button class="player-btn-toggle" style="width: 44px; height: 44px; border-radius: 50%; background: #0A84FF; border: none; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px;">▶</button></div></div></div>`
        },
        {
          id: 'status-badge',
          name: '实时在线胶囊',
          desc: '圆角半透明状态条',
          icon: '🟢',
          html: `<div class="canvas-widget" data-widget-id="status-badge" style="position: absolute; left: 24px; top: 30px; background: rgba(10, 132, 255, 0.25); border: 1px solid rgba(10, 132, 255, 0.5); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 9999px; padding: 6px 14px;"><div class="widget-drag-pill">⠿ 移动</div><div class="widget-content" style="display: flex; align-items: center; gap: 8px;"><div style="width:8px; height:8px; border-radius:50%; background:#30D158; box-shadow:0 0 8px #30D158;"></div><span style="font-size:12px; font-weight:700; color:#fff;">ONLINE RUNNING</span></div></div>`
        }
      ];

      state.catalog = BUILTIN_WIDGETS;

      /* 同步 GitHub 核心引擎（带国内 CDN 加速与错误兜底） */
      async function executeSync() {
        const repo = document.getElementById('sync-repo-name').value.trim() || 'zhangzhanhang855/html-maker';
        const branch = document.getElementById('sync-branch-name').value.trim() || 'main';

        syncStatusText.textContent = '正在连接节点并拉取 widgets.json...';
        syncStatusText.style.color = '#0A84FF';

        // 镜像 CDN 列表（解决 IPA 中 Raw GitHub 被拦截与 CORS 限制）
        const candidateURLs = [
          `https://cdn.jsdelivr.net/gh/${repo}@${branch}/widgets.json`,
          `https://fastly.jsdelivr.net/gh/${repo}@${branch}/widgets.json`,
          `https://cdn.staticaly.com/gh/${repo}/${branch}/widgets.json`,
          `https://raw.githubusercontent.com/${repo}/${branch}/widgets.json`
        ];

        let success = false;
        let fetchedData = null;

        for (const url of candidateURLs) {
          try {
            const resp = await fetch(url + `?t=${Date.now()}`, { cache: 'no-cache' });
            if (resp.ok) {
              fetchedData = await resp.json();
              if (Array.isArray(fetchedData) && fetchedData.length > 0) {
                success = true;
                break;
              }
            }
          } catch (e) {
            console.warn('节点拉取失败，尝试下一节点:', url);
          }
        }

        if (success && fetchedData) {
          state.catalog = fetchedData;
          renderCatalog();
          syncStatusText.textContent = `同步成功！已载入 ${fetchedData.length} 个最新组件。`;
          syncStatusText.style.color = '#30D158';
          notify('GitHub 仓库同步成功');
        } else {
          syncStatusText.textContent = '无法从指定仓库拉取 widgets.json，已保留本地内置组件。请确认仓库已公开 (Public) 且包含 widgets.json。';
          syncStatusText.style.color = '#FF453A';
          notify('同步失败，请检查网络或仓库名');
        }
      }

      document.getElementById('btn-start-sync').addEventListener('click', executeSync);

      function renderCatalog() {
        const list = document.getElementById('catalog-list');
        list.innerHTML = '';
        state.catalog.forEach(item => {
          const card = document.createElement('div');
          card.className = 'widget-item';
          card.innerHTML = `
            <div class="widget-thumb">${item.icon || '🧩'}</div>
            <div>
              <div class="widget-label">${item.name}</div>
              <div class="widget-desc">${item.desc || ''}</div>
            </div>
          `;
          card.addEventListener('click', () => {
            placeWidgetOnCanvas(item.html);
            closeDrawer('drawer-widgets', 'scrim-widgets');
            notify(`已添加: ${item.name}`);
          });
          list.appendChild(card);
        });
      }

      /* 拖动与交互绑定 */
      function placeWidgetOnCanvas(htmlPayload) {
        const dummy = document.createElement('div');
        dummy.innerHTML = htmlPayload.trim();
        const widgetNode = dummy.firstElementChild;
        canvas.appendChild(widgetNode);
        registerInteractions(widgetNode);
        bindAudioWidgetLogic(widgetNode);
        highlightNode(widgetNode);
      }

      function highlightNode(el) {
        if (state.activeNode) {
          state.activeNode.classList.remove('selected');
        }
        state.activeNode = el;
        if (el) {
          el.classList.add('selected');
          deleteBtn.style.display = 'inline-flex';
        } else {
          deleteBtn.style.display = 'none';
        }
      }

      deleteBtn.addEventListener('click', () => {
        if (state.activeNode) {
          state.activeNode.remove();
          highlightNode(null);
          notify('组件已移除');
        }
      });

      canvas.addEventListener('pointerdown', (e) => {
        if (e.target === canvas) highlightNode(null);
      });

      function registerInteractions(element) {
        let isMoving = false;
        let startX = 0, startY = 0;
        let originLeft = 0, originTop = 0;

        element.addEventListener('pointerdown', (e) => {
          // 如果点击的是输入框/滑块/按钮，不触发拖拽
          if (['INPUT', 'BUTTON'].includes(e.target.tagName)) return;
          e.stopPropagation();
          highlightNode(element);
          isMoving = true;
          element.setPointerCapture(e.pointerId);

          startX = e.clientX;
          startY = e.clientY;
          originLeft = element.offsetLeft;
          originTop = element.offsetTop;
        });

        element.addEventListener('pointermove', (e) => {
          if (!isMoving) return;
          const deltaX = e.clientX - startX;
          const deltaY = e.clientY - startY;
          element.style.left = `${originLeft + deltaX}px`;
          element.style.top = `${originTop + deltaY}px`;
        });

        const release = (e) => {
          if (isMoving) {
            isMoving = false;
            try { element.releasePointerCapture(e.pointerId); } catch (_) {}
          }
        };

        element.addEventListener('pointerup', release);
        element.addEventListener('pointercancel', release);
      }

      /* 针对音乐播放器组件的即时逻辑绑定（解析 MP3/FLAC） */
      function bindAudioWidgetLogic(root) {
        const fileInput = root.querySelector('.player-file-input');
        const audio = root.querySelector('.player-audio-core');
        if (!fileInput || !audio) return;

        const artWrap = root.querySelector('.player-art-wrap');
        const ejectBtn = root.querySelector('.player-btn-eject');
        const toggleBtn = root.querySelector('.player-btn-toggle');
        const coverImg = root.querySelector('.player-cover-img');
        const fallback = root.querySelector('.player-cover-fallback');
        const titleEl = root.querySelector('.player-track-title');
        const artistEl = root.querySelector('.player-track-artist');
        const bar = root.querySelector('.player-progress-bar');
        const curEl = root.querySelector('.player-cur-time');
        const totalEl = root.querySelector('.player-total-time');

        const trigger = () => fileInput.click();
        if (artWrap) artWrap.addEventListener('click', trigger);
        if (ejectBtn) ejectBtn.addEventListener('click', trigger);

        fileInput.addEventListener('change', async (e) => {
          const file = e.target.files[0];
          if (!file) return;

          titleEl.textContent = file.name.replace(/\.[^/.]+$/, "");
          artistEl.textContent = "未知歌手";
          coverImg.style.display = 'none';
          fallback.style.display = 'block';

          audio.src = URL.createObjectURL(file);

          try {
            const buffer = await file.arrayBuffer();
            const view = new DataView(buffer);

            // ID3 (MP3) 标签解析
            if (buffer.byteLength >= 10 && String.fromCharCode(view.getUint8(0), view.getUint8(1), view.getUint8(2)) === 'ID3') {
              let offset = 10;
              while (offset < view.byteLength - 10) {
                const fid = String.fromCharCode(view.getUint8(offset), view.getUint8(offset + 1), view.getUint8(offset + 2), view.getUint8(offset + 3));
                if (!/^[A-Z0-9]{4}$/.test(fid)) break;
                const sz = (view.getUint8(offset + 4) << 21) | (view.getUint8(offset + 5) << 14) | (view.getUint8(offset + 6) << 7) | view.getUint8(offset + 7);
                offset += 10;
                if (offset + sz > view.byteLength) break;

                if (fid === 'TIT2') {
                  const b = new Uint8Array(view.buffer, view.byteOffset + offset + 1, sz - 1);
                  titleEl.textContent = new TextDecoder('utf-8').decode(b).replace(/\0/g, '');
                } else if (fid === 'TPE1') {
                  const b = new Uint8Array(view.buffer, view.byteOffset + offset + 1, sz - 1);
                  artistEl.textContent = new TextDecoder('utf-8').decode(b).replace(/\0/g, '');
                } else if (fid === 'APIC') {
                  let p = offset + 1;
                  let mime = "";
                  while (p < offset + sz && view.getUint8(p) !== 0) {
                    mime += String.fromCharCode(view.getUint8(p));
                    p++;
                  }
                  p += 2;
                  while (p < offset + sz && view.getUint8(p) !== 0) p++;
                  p++;
                  const imgData = new Uint8Array(view.buffer, view.byteOffset + p, sz - (p - offset));
                  coverImg.src = URL.createObjectURL(new Blob([imgData], { type: mime || 'image/jpeg' }));
                  coverImg.style.display = 'block';
                  fallback.style.display = 'none';
                }
                offset += sz;
              }
            }
          } catch (_) {}

          audio.play().catch(() => {});
        });

        toggleBtn.addEventListener('click', () => {
          if (!audio.src) { trigger(); return; }
          if (audio.paused) {
            audio.play();
            toggleBtn.textContent = '❚❚';
          } else {
            audio.pause();
            toggleBtn.textContent = '▶';
          }
        });

        audio.addEventListener('timeupdate', () => {
          if (!audio.duration) return;
          bar.value = (audio.currentTime / audio.duration) * 100;
          const cm = Math.floor(audio.currentTime / 60);
          const cs = Math.floor(audio.currentTime % 60);
          curEl.textContent = `${cm}:${cs < 10 ? '0' : ''}${cs}`;
        });

        audio.addEventListener('loadedmetadata', () => {
          const tm = Math.floor(audio.duration / 60);
          const ts = Math.floor(audio.duration % 60);
          totalEl.textContent = `${tm}:${ts < 10 ? '0' : ''}${ts}`;
        });

        bar.addEventListener('input', (e) => {
          if (!audio.duration) return;
          audio.currentTime = (e.target.value / 100) * audio.duration;
        });
      }

      /* 导出完整 HTML 并唤起系统分享 */
      document.getElementById('action-export').addEventListener('click', async () => {
        highlightNode(null);

        const cleanCanvas = canvas.cloneNode(true);
        cleanCanvas.querySelectorAll('.widget-drag-pill').forEach(p => p.remove());
        cleanCanvas.querySelectorAll('.canvas-widget').forEach(w => {
          w.classList.remove('selected');
          w.removeAttribute('data-widget-id');
          w.style.cursor = 'default';
        });

        const bgStyle = state.isImage
          ? `background-image: url('${state.background}'); background-size: cover; background-position: center;`
          : (state.background.includes('gradient')
            ? `background: ${state.background};`
            : `background-color: ${state.background};`);

        const standaloneDoc = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>导出网页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #viewport-root {
      width: 100%;
      height: 100%;
      position: relative;
      ${bgStyle}
      overflow: hidden;
    }
    .canvas-widget { position: absolute; }
  </style>
</head>
<body>
  <div id="viewport-root">
    ${cleanCanvas.innerHTML}
  </div>
</body>
</html>`;

        const filename = `page-${Date.now()}.html`;
        const blob = new Blob([standaloneDoc], { type: 'text/html;charset=utf-8' });

        // iOS WKWebView 原生 Share Sheet 分享
        if (navigator.share) {
          const file = new File([blob], filename, { type: 'text/html' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({
                title: '分享制作的网页',
                files: [file]
              });
              notify('已调起系统分享');
              return;
            } catch (err) {
              if (err.name !== 'AbortError') notify('分享取消或失败');
            }
          }
        }

        // 备用下载
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        notify('文件已导出下载');
      });

      // 初始化
      applyBackground();
      renderCatalog();
    })();
  </script>
</body>
</html>
